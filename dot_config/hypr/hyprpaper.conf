# hyprpaper 0.8+
# Rotate through everything in the Syncthing wallpaper folder, in random order.
# `timeout` is in seconds (if omitted it defaults to 30s when a folder is used).
# New files are picked up the next time hyprpaper starts.
wallpaper {
    monitor   = *
    path      = ~/Documents/Syncthing/Pictures/wallpapers
    fit_mode  = cover
    timeout   = 1800
    order     = random-shuffle
    recursive = 0
}

# Don't draw the Hyprland version text over the wallpaper
splash = 0
