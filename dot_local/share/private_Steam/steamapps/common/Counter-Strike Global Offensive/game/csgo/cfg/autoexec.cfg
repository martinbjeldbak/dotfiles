// ============================================================
//  autoexec.cfg  —  managed by chezmoi (~/.local/share/chezmoi)
//  Loaded via `+exec autoexec` in the Steam launch options.
//
//  Source of truth for mouse, HUD, gameplay prefs, network, perf, binds, and
//  practice tools. (Crosshair & viewmodel are deliberately left to the in-game
//  menu — see that section.) The game rewrites its .vcfg files on every exit,
//  but it never touches this file — so this is what's version-controlled.
//  Console convars here override the saved .vcfg values on each launch.
//
//  NOT pulled in (intentionally): UI state, cached timestamps, map/loadout
//  lists, radio-wheel text, joystick defaults, most snd_* (many use $-suffixed
//  per-slot variants that don't set cleanly from console). Video settings
//  (AO/MSAA/resolution) live in cs2_video.txt and can't be convars.
// ============================================================

// ---------- Mouse / sensitivity ----------
sensitivity "1.1"
zoom_sensitivity_ratio "1"
sensitivity_y_scale "1"
m_yaw "0.022"
m_pitch "0.022"
mouse_inverty "false"

// ---------- Crosshair & Viewmodel ----------
// Intentionally NOT set here — left to the in-game settings menu so UI tweaks
// persist (they live in cs2_user_convars.vcfg). Adjust them in the menu and
// they stick across launches like normal.

// ---------- HUD / radar ----------
hud_scaling "1"
hud_fastswitch "0"
cl_hud_color "0"
cl_radar_always_centered "true"
cl_radar_rotate "true"
cl_radar_scale "0.7"
cl_radar_icon_scale_min "0.6"
cl_hud_radar_scale "1"
cl_hud_radar_background_alpha "0.627"
cl_teammate_colors_show "1"
hud_showtargetid "true"
cl_showloadout "true"

// ---------- Gameplay prefs ----------
cl_prefer_lefthanded "true"
cl_use_opens_buy_menu "false"
cl_silencer_mode "0"
cl_sniper_auto_rezoom "true"
cl_debounce_zoom "true"
cl_dm_buyrandomweapons "true"
cl_grenadecrosshair_explosive "true"
cl_grenadecrosshair_fire "true"
cl_grenadecrosshair_flash "true"
cl_grenadecrosshair_smoke "true"
cl_grenadecrosshair_decoy "true"

// ---------- Network ----------
rate "786432"
cl_net_buffer_ticks "0"

// ---------- Performance ----------
fps_max "141"         // ~3 below 144Hz so frames stay inside the VRR window
r_low_latency "1"     // NVIDIA Reflex (set 2 to try Reflex+Boost)

// ---------- Keybinds (movement = CS2 defaults; below are customizations) ----------
bind "mouse1"     "+attack; r_cleardecals"
bind "mwheeldown" "+jump"
bind "q"          "+fastswitch"
bind "t"          "switchhands"
bind "v"          "toggle voice_enable 0 1"
bind "c"          "+voicerecord"
bind "j"          "toggle fov_cs_debug 30 0"
unbind "f"        // was a stale +jumpaction (stray jump); jumpthrow done manually
// Grenades (all on mouse buttons)
bind "mouse4" "slot8"                                    // smoke
bind "mouse5" "slot7"                                    // flash
bind "mouse3" "use weapon_molotov;use weapon_incgrenade" // incendiary (CT) / molotov (T)
// Volume + ignore radio/msg
bind "uparrow"   "incrementvar volume 0.0 1.0 0.05"
bind "downarrow" "incrementvar volume 0.0 1.0 -0.05"
bind "leftarrow"  "ignorerad"
bind "rightarrow" "ignoremsg"

// ---------- Nade practice toggle ----------
// Run `prac_on` in console on a private map to set up infinite nades +
// trajectory/preview; `prac_off` to revert.
alias "prac_on"  "sv_cheats 1;sv_infinite_ammo 1;ammo_grenade_limit_total 5;mp_buy_anywhere 1;mp_buytime 60000;mp_maxmoney 60000;mp_startmoney 60000;mp_freezetime 0;mp_roundtime 60;mp_roundtime_defuse 60;mp_warmup_end;mp_limitteams 0;mp_autoteambalance 0;bot_quota 0;bot_kick;sv_grenade_trajectory_prac_pipreview 1;sv_grenade_trajectory_prac_trailtime 5;sv_grenade_trajectory_time_spectator 8;sv_showimpacts 1;mp_restartgame 1"
alias "prac_off" "sv_cheats 0;sv_infinite_ammo 0;ammo_grenade_limit_total 3;mp_buy_anywhere 0;mp_buytime 20;sv_grenade_trajectory_prac_pipreview 0;sv_showimpacts 0;mp_restartgame 1"

// Practice keys (only do anything while sv_cheats 1 / prac_on is active):
bind "h" "noclip"                  // fly (toggle)
bind "n" "sv_rethrow_last_grenade" // re-throw your last nade from where you stood

// Map shortcuts: loads the map in Casual (so prac_on applies cleanly),
// then run `prac_on`. e.g. type `prac_mirage` then `prac_on`.
alias "prac_dust2"   "game_type 0;game_mode 0;map de_dust2"
alias "prac_mirage"  "game_type 0;game_mode 0;map de_mirage"
alias "prac_inferno" "game_type 0;game_mode 0;map de_inferno"
alias "prac_nuke"    "game_type 0;game_mode 0;map de_nuke"
alias "prac_ancient" "game_type 0;game_mode 0;map de_ancient"
alias "prac_anubis"  "game_type 0;game_mode 0;map de_anubis"
alias "prac_train"   "game_type 0;game_mode 0;map de_train"
alias "prac_vertigo" "game_type 0;game_mode 0;map de_vertigo"
alias "prac_overpass" "game_type 0;game_mode 0;map de_overpass"

echo "########## autoexec.cfg loaded ##########"
