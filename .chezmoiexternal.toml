[".local/share/delta-catppuccin"]
    type = "archive"
    url = "https://github.com/catppuccin/delta/archive/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".config/atuin/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/atuin/archive/main.zip"
    exact = true
    stripComponents = 2
    refreshPeriod = "168h"
    include = ["*/themes/**"]

[".config/bat/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/bat/archive/main.tar.gz"
    exact = true
    stripComponents = 2
    refreshPeriod = "168h"
    include = ["*/themes/**"]

[".config/alacritty/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/alacritty/archive/main.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
    include = ["*/catppuccin-*.toml"]

[".config/btop/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/btop/archive/main.tar.gz"
    exact = true
    stripComponents = 2
    refreshPeriod = "168h"
    include = ["*/themes/**"]

[".local/share/rofi/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/rofi/archive/refs/heads/main.zip"
    exact = true
    stripComponents = 6
    refreshPeriod = "168h"
    include = ["*/basic/.local/share/rofi/themes/**"]

# Catppuccin Hyprland v2.0.0 Lua themes (Hyprland 0.55+).
# hyprlock still needs hyprlang, so its legacy palette is vendored locally in
# dot_config/hypr/frappe.conf.
[".config/hypr/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/hyprland/archive/refs/tags/v2.0.0.tar.gz"
    stripComponents = 2
    refreshPeriod = "168h"
    include = ["*/themes/*.lua"]


[".tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

